name: AI 自动代码审查
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 获取代码变更
        id: diff
        run: |
          git fetch origin main --depth=1
          echo "DIFF<<DIFF_EOF" >> $GITHUB_OUTPUT
          git diff origin/main...HEAD >> $GITHUB_OUTPUT
          echo "DIFF_EOF" >> $GITHUB_OUTPUT

      - name: 运行 AI 审查
        env:
          API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          curl -s https://api.modelscope.cn/v1/chat/completions \
            -H "Authorization: Bearer $API_KEY" \
            -H "Content-Type: application/json" \
            -d '{
              "model": "Qwen/Qwen2.5-Coder-32B-Instruct",
              "messages": [
                {"role":"system","content":"审查代码变更，找出bug、安全问题、代码质量问题。用中文。"},
                {"role":"user","content":"审查代码变更：${{ steps.diff.outputs.DIFF }}"}
              ],
              "temperature": 0.1,
              "max_tokens": 2000
            }' > /tmp/review_response.json

      - name: 生成审查报告
        run: |
          echo "## 🤖 AI 自动代码审查" >> $GITHUB_STEP_SUMMARY
          python3 review_formatter.py >> $GITHUB_STEP_SUMMARY
