name: Claude Code 自动审查
on:
  pull_request:
    types: [opened, synchronize]
  push:
    branches: [main]
jobs:
  review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: 安装 Claude Code CLI
        run: npm install -g @anthropic-ai/claude-code --unsafe-perm
      - name: Claude Code 审查
        run: |
          git fetch origin main --depth=1
          git diff origin/main...HEAD | claude -p "审查以下代码变更，检查：1) 明显 bug 2) 安全问题 3) Python 风格 4) 缺少类型标注。用中文回复，给出修改建议。" --max-turns 3
        env:
          ANTHROPIC_BASE_URL: https://api.modelscope.cn/v1
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
